


###################################################3

csv_name: delete
target_chunks: data/target_chunks_sample.json

# --- Backend Logging  ---

aws_s3_bucket: "vision-rag-temp-bucket"
delete_s3_csv: True


#####################################################

metrics_config: null
metrics_config_path: "config/metrics_config.json"


#####################################################

results_dirs:
  output_dir: ./eval_results
  vrag_result_json : "visionragresult.json"
  generated_answers_file : "generated_answers.json"
  retriever_metrics : "retriever_metrics.json"

#####################################################

vrag_retriever:
  user_id: "007"
  collection_name: BL3200_HAND_HELD_BLOWER
  query_reformulation: False
  use_reranking: False
  use_hybrid: False 
  chunk_format: "chunk{id}"

#####################################################

vrag_client:
  VISIONRAG_URL: "http://127.0.0.1:8000/api/v1/evaluation/users/{user_id}/chat_eval"
  vector_top_k: 10
  bm25_top_k: 10
  rerank_top_k: 8
  final_top_k: 5
  memory_enabled: true
  timeout: 300
  
