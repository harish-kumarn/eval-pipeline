


###################################################3

csv_name: LB30_FUEL_INFO
target_chunks: data/merged_testing_dataset.json

# --- Backend Logging  ---

aws_s3_bucket: "vision-rag-temp-bucket"
delete_s3_csv: False


#####################################################

metrics_config: null
metrics_config_path: "config/metrics_config.json"


#####################################################

results_dirs:
  output_dir: ./eval_results
  vrag_result_json : "visionragresult.json"
  generated_answers_file : "generated_answers.json"
  retriever_metrics : "retriever_metrics.json"
  retriever_metrics_csv: "retriever_metrics.csv"

#####################################################

vrag_retriever:
  user_id: "777"
  collection_name: LB30_FUEL_INFO
  query_reformulation: True
  use_reranking: True
  use_hybrid: True 
  chunk_format: "chunk{id}"

#####################################################

vrag_client:
  VISIONRAG_URL: "http://127.0.0.1:8000/api/v1/evaluation/users/{user_id}/chat_eval"
  vector_top_k: 10
  bm25_top_k: 10
  rerank_top_k: 8
  final_top_k: 5
  memory_enabled: False
  timeout: 300
  
#####################################################



  